name: Marées

# Prépare les marées des dix prochains jours (api-maree.fr) dans
# marees_cache.json. Séparé du calcul des notes : si le service de marées
# tombe, seule cette tâche échoue, et les prévisions continuent sur la copie.

on:
  schedule:
    # Deux fois par jour, à 4 h 40 et 16 h 40 UTC.
    - cron: "40 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marees
  cancel-in-progress: false

jobs:
  preparer:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lire les marées
        env:
          API_MAREE_KEY: ${{ secrets.API_MAREE_KEY }}
          SITE_MAREE_WIMEREUX: ${{ vars.SITE_MAREE_WIMEREUX || 'boulogne-sur-mer' }}
          SITE_MAREE_CALAIS: ${{ vars.SITE_MAREE_CALAIS || 'calais' }}
        run: python marees.py

      - name: Publier
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f marees_cache.json ]; then git add marees_cache.json; fi
          git diff --staged --quiet && exit 0
          git commit -m "Marées $(date +'%Y-%m-%d %H:%M')"
          for essai in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((essai * 10))
          done
          exit 1
