name: Prévisions Wimereux

on:
  schedule:
    # Toutes les 3 heures (horaires en UTC : ajoute 1h en hiver, 2h en été)
    - cron: "10 */3 * * *"
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: previsions
  cancel-in-progress: true

jobs:
  calculer:
    runs-on: ubuntu-latest
    env:
      # Les serveurs GitHub tournent en temps universel. Sans ça, l'heure de
      # génération affichée sur la page est en retard de une à deux heures
      # selon la saison, et alerter.py se trompe sur ce qui est déjà passé.
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Calculer les notes
        env:
          API_MAREE_KEY: ${{ secrets.API_MAREE_KEY }}
          SITE_MAREE_WIMEREUX: ${{ vars.SITE_MAREE_WIMEREUX || 'boulogne-sur-mer' }}
          SITE_MAREE_CALAIS: ${{ vars.SITE_MAREE_CALAIS || 'calais' }}
          MODE_VENT: ${{ vars.MODE_VENT || 'moyenne' }}
        run: python previsions.py --heures 96 --json docs/data.json

      - name: Préparer l'alerte
        id: alerte
        # Seuil réglable par une variable du dépôt, 3 par défaut.
        run: |
          python alerter.py \
            --seuil "${{ vars.SEUIL_ALERTE || '3' }}" \
            --seuil-wing "${{ vars.SEUIL_ALERTE_WING || '3' }}" > message.txt
          if [ -s message.txt ]; then
            echo "envoyer=oui" >> "$GITHUB_OUTPUT"
            cat message.txt
          else
            echo "Aucun nouveau créneau au-dessus du seuil."
          fi

      - name: Notifier
        if: steps.alerte.outputs.envoyer == 'oui'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "Pas de sujet ntfy configuré, notification ignorée."
            exit 0
          fi
          curl -sS --fail-with-body \
            -H "Title: Ca se leve" \
            -H "Tags: ocean" \
            -H "Priority: $(cat priorite.txt 2>/dev/null || echo default)" \
            -H "Click: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            --data-binary @message.txt \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Archiver la prévision du jour
        # Une copie datée par jour : c'est cette archive qui permettra plus tard
        # de comparer ce qui était prévu à J-3 avec ce qui s'est réellement passé.
        run: |
          mkdir -p archives
          cp docs/data.json "archives/$(date -u +%Y-%m-%d).json"

      - name: Publier
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json archives/ etat_alertes.json
          git diff --staged --quiet || git commit -m "Prévisions $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
