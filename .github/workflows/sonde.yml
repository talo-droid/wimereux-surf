name: Sonde Candhis (temporaire)

# Lit une fois la page publique de la bouée de la baie de Somme pour voir
# comment les mesures temps réel sont servies. À supprimer ensuite.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonder:
    runs-on: ubuntu-latest
    steps:
      - name: Lire la page
        run: |
          python3 - <<'PY'
          import http.cookiejar, urllib.request, re, base64
          jar = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          op.addheaders = [("User-Agent", "wimereux-surf/1.0 (+https://github.com/talo-droid/wimereux-surf)")]
          base = "https://candhis.cerema.fr/_public_/"
          def lire(u):
              try:
                  r = op.open(u, timeout=40)
                  return r.read().decode("utf-8", "replace")
              except Exception as e:
                  return f"ERREUR {e}"
          p = lire(base + "campagne.php?" + base64.b64encode(b"camp=08002").decode())
          print("=== campagne", len(p))
          print("ETIQUETTES", sorted(set(re.findall(r"<b>([^<]{1,30})<\\?/b>", p))))
          # Chaque série : le texte qui précède le premier point daté.
          for m in re.finditer(r'\[\["(20\d\d-\d\d-\d\d \d\d:\d\d)"', p):
              i = m.start()
              print("SERIE", m.group(1), "AVANT", re.sub(r"\s+", " ", p[max(0, i-700):i]))
              print("DEBUT", re.sub(r"\s+", " ", p[i:i+700]))
          for k in ("getJSON", "$.ajax", "$.post", "$.get(", "fetch(", ".php?"):
              for m in list(re.finditer(re.escape(k), p))[:5]:
                  print("APPEL", k, re.sub(r"\s+", " ", p[max(0, m.start()-150):m.start()+250]))
          c = lire(base + "campagne.js")
          print("=== campagne.js", len(c))
          for k in ("ajax", "post", "get(", ".php", "url"):
              for m in list(re.finditer(re.escape(k), c))[:6]:
                  print("JS", k, re.sub(r"\s+", " ", c[max(0, m.start()-150):m.start()+250]))
          PY
